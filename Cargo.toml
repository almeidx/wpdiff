[package]
name = "wpdiff"
version = "0.1.1-alpha.2"
edition = "2024"
rust-version = "1.96"
description = "Diff locally installed WordPress plugins against their upstream versions"
license = "Apache-2.0"
repository = "https://github.com/almeidx/wpdiff"
readme = "README.md"
keywords = ["wordpress", "diff", "plugins", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# These pedantic lints are too noisy or conflict with readability
too_many_lines = "allow"
struct_excessive_bools = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
case_sensitive_file_extension_comparisons = "allow"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
similar = { version = "3.1.2", features = ["text", "inline", "unicode"] }
colored = "3.1.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }
zip = "8.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
walkdir = "2.5.0"
anyhow = "1.0.104"
regex = "1.13.1"
log = "0.4.33"
env_logger = "0.11.11"
terminal_size = "0.4.4"
glob-match = "0.2.1"
mpatch = { version = "1.6.4", default-features = false, features = ["parallel"] }
rayon = "1.12.0"
indicatif = "0.18.6"
inquire = "0.9.4"

[profile.release]
lto = true
strip = true
